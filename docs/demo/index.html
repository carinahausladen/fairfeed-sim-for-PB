<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}.credits{margin:0;font-size:11px}.credits a{color:#84919B}</style>
<title>FairFeed</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

<style>
  /* Light only, on purpose: the app is white, and so is this page in every theme. */
  :root {
    color-scheme: light;
    --page:        #FFFFFF;
    --deck:        #F2F5F8;
    --surface:     #FFFFFF;
    --surface-2:   #F6F8FA;
    --ink:         #122230;
    --ink-soft:    #52616D;
    --ink-faint:   #84919B;
    --line:        #DDE4EA;
    --line-strong: #C5D0D8;
    --blue:        #1779BA;
    --blue-ink:    #0E5486;
    --blue-wash:   #E4EFF7;
    --green:       #1F7A4D;
    --green-wash:  #E2F1E8;
    --red:         #BF4330;
    --red-wash:    #F8E7E3;
    --amber:       #7A5A12;
    --amber-wash:  #F3EDDB;
    --shadow:      0 18px 44px rgba(16, 36, 54, 0.12);
    --card-shadow: 0 6px 18px rgba(16, 36, 54, 0.10), 0 1px 2px rgba(16, 36, 54, 0.06);
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1880px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 40px 72px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* On wide windows (a laptop, a 1280×720 slide iframe) the four screens stay
     in one row and the script below scales the row to fit the window. */
  @media (min-width: 700px) {
    html, body { overflow: hidden; }
    .wrap { width: max-content; max-width: none; margin: 0; padding-block: 24px; gap: 12px; }
    .gallery { flex-wrap: nowrap; }
  }

  /* ─── PAGE HEADER ─────────────────────────────────────────── */
  .page-head { display: flex; flex-direction: column; gap: 12px; max-width: 64ch; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--blue-ink); }
  h1 {
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: clamp(30px, 5vw, 42px);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .lede { color: var(--ink-soft); font-size: 17px; }
  .lede strong { color: var(--ink); font-weight: 600; }

  /* ─── GALLERY ─────────────────────────────────────────────── */
  .gallery { display: flex; flex-wrap: wrap; gap: 36px 28px; }
  figure.screen { display: flex; flex-direction: column; gap: 14px; width: 330px; max-width: 100%; }
  figcaption { display: flex; flex-direction: column; gap: 3px; }
  .cap-step { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
  .cap-name { font-weight: 600; font-size: 15px; }
  .cap-note { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .cap-try { font-size: 13px; font-weight: 600; color: var(--blue-ink); }

  /* ─── PHONE SHELL ─────────────────────────────────────────── */
  .phone {
    width: 100%;
    height: 716px;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: 30px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .app-head {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }
  .head-row { display: flex; align-items: center; gap: 9px; }
  .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--blue); display: grid; place-items: center; flex-shrink: 0; }
  .mark svg { display: block; }
  .wordmark { font-weight: 600; font-size: 14.5px; letter-spacing: -0.005em; flex: 1; }
  .chip-quiet {
    font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--ink-soft); border: 1px solid var(--line-strong); border-radius: 4px; padding: 2px 6px;
  }

  .rail { height: 3px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
  .rail span { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 2px; }

  .segs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .seg { height: 3px; border-radius: 2px; background: var(--line); transition: background 200ms ease; }
  .seg.done { background: var(--blue); }
  .seg.here { background: var(--blue-wash); box-shadow: inset 0 0 0 1px var(--blue); }

  .step-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .step-label { font-size: 10px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .step-label b { color: var(--blue-ink); font-weight: 700; }
  .step-count { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .head-note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; margin-top: -4px; padding-bottom: 10px; }
  .segs.three { grid-template-columns: repeat(3, 1fr); }

  /* calibration: a grid of four, its own Less / More under each photo — clearly not the feed */
  .cal-row { display: flex; align-items: center; gap: 8px; }
  .cal-tag { flex: 1; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue-ink); }
  .app-body .info-pop { font-size: 12.5px; }
  .cal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .cal-tile { position: relative; min-width: 0; background: var(--surface); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  /* the ring sits on top of photo and buttons, so a chosen state is never covered */
  .cal-tile::after { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; }
  .cal-tile.more::after { box-shadow: inset 0 0 0 3px var(--green); }
  .cal-tile.less::after { box-shadow: inset 0 0 0 3px var(--red); }
  .cal-tile.less .cal-img { filter: grayscale(0.8); opacity: 0.55; }
  .cal-tile.less .cal-title { opacity: 0.55; }
  .cal-img { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--deck); }
  .cal-title { font-size: 12px; font-weight: 600; line-height: 1.3; margin: 6px 8px 7px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); margin-top: auto; }
  .duo button { border: none; background: var(--surface); padding: 7px 2px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .duo button + button { border-left: 1px solid var(--line); }
  .duo button.less[aria-pressed="true"] { background: var(--red-wash); color: var(--red); }
  .duo button.more[aria-pressed="true"] { background: var(--green-wash); color: var(--green); }
  .duo button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  /* the small "i": the explanation stays out of the way until someone asks */
  .info-btn { width: 24px; height: 24px; padding: 0; border: none; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-faint); border-radius: 50%; flex-shrink: 0; }
  .info-btn[aria-expanded="true"] { color: var(--blue); }
  .info-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .info-pop { font-size: 12.5px; color: var(--ink); line-height: 1.45; background: var(--blue-wash); border-radius: 8px; padding: 8px 11px; }

  .finish {
    font-family: inherit; font-size: 11.5px; font-weight: 600; color: #FFFFFF;
    background: var(--blue); border: none; border-radius: 999px; padding: 3px 10px; cursor: pointer;
  }
  .reject-pill {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line-strong); color: var(--ink-faint); font-variant-numeric: tabular-nums;
    transition: color 200ms ease, border-color 200ms ease, background 200ms ease;
  }
  .reject-pill.live { color: var(--red); border-color: var(--red); background: var(--red-wash); }

  .app-body {
    flex: 1; overflow-y: auto; scrollbar-width: none;
    padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px;
    background: var(--surface);
  }
  .app-body::-webkit-scrollbar { display: none; }
  .app-body h2 {
    font-family: "Source Serif 4", Georgia, serif; font-size: 21px; font-weight: 600;
    line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance;
  }
  .app-body p { font-size: 14px; line-height: 1.55; }
  .soft { color: var(--ink-soft); }

  /* ─── CONSENT ─────────────────────────────────────────────── */
  .terms { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .term { display: grid; grid-template-columns: 78px 1fr; gap: 10px; padding-block: 9px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
  .term dt { font-weight: 600; }
  .term dd { color: var(--ink-soft); }
  .choice { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }

  /* ─── BRIEF ───────────────────────────────────────────────── */
  .notes { display: flex; flex-direction: column; gap: 10px; }
  .note { display: flex; gap: 10px; align-items: flex-start; }
  .note-mark { flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; margin-top: 1px; }
  .note-mark.warn { background: var(--amber-wash); color: var(--amber); }
  .note-mark.ai { background: var(--blue-wash); color: var(--blue-ink); }
  .note p { font-size: 13px; color: var(--ink-soft); }
  .note strong { color: var(--ink); font-weight: 600; }
  .field {
    border: 1.5px solid var(--blue); border-radius: 12px; background: var(--surface);
    padding: 12px 13px; font-size: 14px; line-height: 1.5; min-height: 128px; box-shadow: 0 0 0 3px var(--blue-wash);
  }
  .caret { display: inline-block; width: 1.5px; height: 15px; background: var(--blue); vertical-align: -3px; margin-left: 1px; animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .field-hint { font-size: 12px; color: var(--blue-ink); font-weight: 500; text-align: right; }

  .btn {
    border: 1.5px solid var(--blue); border-radius: 999px; background: var(--blue); color: #FFFFFF;
    font-family: inherit; font-size: 15px; font-weight: 600; padding: 12px 18px; cursor: pointer;
  }
  .btn.ghost { background: var(--surface); color: var(--blue-ink); }
  .btn.push { margin-top: auto; }
  .btn:focus-visible, .swipe-btn:focus-visible, .deck:focus-visible, .finish:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ─── BADGES ──────────────────────────────────────────────── */
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0; }
  .badge-cat { background: var(--blue-wash); color: var(--blue-ink); }
  .badge-guess { background: var(--surface); color: var(--ink-soft); border: 1px dashed var(--line-strong); }
  .badge-guess b { color: var(--ink); font-weight: 600; }
  .badge-lift { background: #FCF3D6; color: #6E5210; border: 1px solid #D4A21F; font-family: inherit; line-height: inherit; }
  button.badge-lift { cursor: pointer; }
  button.badge-lift[aria-expanded="true"] { background: #D4A21F; color: var(--ink); }
  .badge svg { display: block; }

  /* lifted proposals: gold edge, and the eye opens one line saying why */
  .card.lifted { border: 1.5px solid #D4A21F; box-shadow: 0 0 0 3px #FCF3D6, var(--card-shadow); }
  .card.under.lifted { box-shadow: none; }
  .lift-pop {
    position: absolute; top: 41px; left: 14px; right: 14px; z-index: 2;
    font-size: 12.5px; line-height: 1.45; color: #6E5210;
    background: #FCF3D6; border: 1px solid #D4A21F; border-radius: 8px;
    padding: 8px 11px; box-shadow: var(--card-shadow);
  }

  /* ─── SWIPE DECK ──────────────────────────────────────────── */
  .deck {
    flex: 1;
    position: relative;
    background: var(--deck);
    padding: 14px 14px 0;
    overflow: hidden;
    outline: none;
  }

  .card {
    position: absolute;
    inset: 14px 14px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    padding: 12px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
    will-change: transform;
  }
  .card:active { cursor: grabbing; }
  .card.under { transform: translateY(8px) scale(0.965); filter: saturate(0.9); pointer-events: none; }
  .card.under > * { opacity: 0.35; }
  .card.snap { transition: transform 220ms cubic-bezier(.2,.8,.2,1); }
  .card.fly { transition: transform 300ms ease-in, opacity 300ms ease-in; }

  .card-img { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: var(--surface-2); pointer-events: none; }
  .card-title { font-family: "Source Serif 4", Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; }
  .card-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  .card.no-img .card-desc { -webkit-line-clamp: 9; }
  .reason { border-left: 2px solid var(--blue); padding-left: 9px; font-size: 12.5px; color: var(--ink-soft); font-style: italic; }
  .readmore { align-self: flex-start; background: none; border: none; padding: 0; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--blue-ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-top: auto; }

  /* stamps appear as the card is dragged */
  .stamp {
    position: absolute;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 8px;
    border: 2px solid currentColor;
    background: var(--surface);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .stamp.more { top: 18px; left: 16px; color: var(--green); transform: rotate(-10deg); }
  .stamp.less { top: 18px; right: 16px; color: var(--red); transform: rotate(10deg); }
  .stamp.neutral { bottom: 18px; left: 50%; transform: translateX(-50%); color: var(--ink-soft); }

  .deck-done {
    position: absolute; inset: 14px 14px 10px;
    border: 1.5px dashed var(--line-strong); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 20px; color: var(--ink-soft); font-size: 13.5px;
  }
  .deck-done strong { font-family: "Source Serif 4", Georgia, serif; font-size: 19px; color: var(--ink); font-weight: 600; }
  .deck-done .log { display: flex; flex-direction: column; gap: 4px; font-size: 12px; text-align: left; width: 100%; }
  .deck-done .log span { display: flex; gap: 8px; }
  .deck-done .log i { font-style: normal; font-weight: 600; min-width: 92px; }
  .log .v-more { color: var(--green); }
  .log .v-less { color: var(--red); }
  .log .v-neutral { color: var(--ink-soft); }

  /* the three directions, spelled out and tappable */
  .swipe-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 10px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .swipe-row { display: flex; justify-content: center; align-items: center; gap: 22px; }
  .swipe-btn {
    font-family: inherit; font-size: 20px; font-weight: 600; line-height: 1;
    width: 50px; height: 50px; border-radius: 50%; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    background: var(--surface); border: 1.5px solid var(--line-strong); color: var(--ink-soft);
    box-shadow: 0 2px 6px rgba(16, 36, 54, 0.08);
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease, opacity 120ms ease;
  }
  .swipe-btn.neutral { width: 40px; height: 40px; font-size: 17px; }
  .swipe-btn.less { color: var(--red); border-color: color-mix(in srgb, var(--red) 55%, var(--line)); }
  .swipe-btn.more { color: var(--green); border-color: color-mix(in srgb, var(--green) 55%, var(--line)); }
  .swipe-btn.less:hover { background: var(--red-wash); }
  .swipe-btn.more:hover { background: var(--green-wash); }
  .swipe-btn.neutral:hover { background: var(--surface-2); }
  .swipe-btn.locked { opacity: 0.5; border-style: dashed; cursor: not-allowed; color: var(--ink-faint); border-color: var(--line-strong); }
  .swipe-btn.locked:hover { background: var(--surface); }

  .progress-line { text-align: center; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .progress-line strong { color: var(--ink-soft); font-weight: 600; }
  .reject-pill.nudge { animation: nudge 420ms ease; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* ─── PROFILE ─────────────────────────────────────────────── */
  .profile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .profile-label { font-size: 10px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-faint); }
  .profile q { font-family: "Source Serif 4", Georgia, serif; font-size: 18px; line-height: 1.4; quotes: none; }
  .profile q mark { background: var(--blue-wash); color: var(--blue-ink); border-radius: 3px; padding: 0 3px; }
  .profile small { font-size: 11.5px; color: var(--ink-faint); }
  .tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tally div { border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; gap: 1px; }
  .tally b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .t-more { background: var(--green-wash); color: var(--green); }
  .t-neut { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }
  .t-less { background: var(--red-wash); color: var(--red); }

  /* ─── NOTES BELOW ─────────────────────────────────────────── */
  .changes { display: flex; flex-direction: column; gap: 18px; }
  .changes h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; }
  .change-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .change { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .change h3 { font-size: 14px; font-weight: 600; }
  .change p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .swatches { display: flex; gap: 5px; margin-top: 4px; align-items: center; }
  .sw { width: 26px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.08); }
  .arrow-mini { color: var(--ink-faint); font-size: 12px; }

  @media (max-width: 520px) {
    .phone { height: 660px; border-radius: 24px; }
    figure.screen { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .caret, .reject-pill.nudge { animation: none; }
    .card.snap, .card.fly, .seg, .reject-pill { transition: none; }
  }
</style>

</head>
<body>
<div class="wrap">


  <section class="gallery">

    <!-- ── BRIEF ── -->
    <figure class="screen">
      <div class="phone">
        <div class="app-head">
          <div class="head-row">
            <span class="mark"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3h8M2 6h6M2 9h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <span class="wordmark">FairFeed</span>
            <span class="chip-quiet">Uni Konstanz</span>
          </div>
          <div class="segs three"><span class="seg done"></span><span class="seg"></span><span class="seg"></span></div>
        </div>
        <div class="app-body">
          <h2>What would you like to see change where you live?</h2>
          <p class="soft">Write a few sentences in your own words: what you would like more of, and anything you would rather not see.</p>
          <div class="notes">
            <div class="note">
              <span class="note-mark ai">AI</span>
              <p>Your text is sent to an <strong>AI tool</strong> that writes a short summary of your interests.</p>
            </div>
            <div class="note">
              <span class="note-mark warn">!</span>
              <p><strong>Interests only, please.</strong> Do not write your name, email address, or anything else that could identify you.</p>
            </div>
          </div>
          <div class="field">I would like safer cycling routes and more trees and green space near where I live. Things for teenagers to do matter to me too. I am less interested in car parks and festivals.<span class="caret"></span></div>
          <div class="field-hint">This is really helpful. Anything else on your mind?</div>
          <button class="btn push" type="button">Build my feed →</button>
        </div>
      </div>
    </figure>

    <!-- ── CALIBRATION (grid) ── -->
    <figure class="screen">
      <div class="phone">
        <div class="app-head">
          <div class="head-row">
            <span class="mark"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3h8M2 6h6M2 9h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <span class="wordmark">FairFeed</span>
            <span class="chip-quiet">Uni Konstanz</span>
          </div>
          <div class="segs three"><span class="seg done"></span><span class="seg done"></span><span class="seg"></span></div>
        </div>
        <div class="app-body">
          <div class="cal-row">
            <span class="cal-tag">Calibration</span>
            <span class="step-count" id="cal-count">Set 1 of 2</span>
            <button class="info-btn" type="button" id="cal-info" aria-label="More information" aria-expanded="false" aria-controls="cal-info-pop">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/><path d="M12 10.8v6.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
          <p class="info-pop" id="cal-info-pop" role="note" hidden>Your answers change the next set. Leave any you are unsure about.</p>
          <h2>More or less of these?</h2>
          <div class="cal-grid" id="cal-grid"></div>
          <button class="btn push" type="button" id="cal-next">Next 4 →</button>
        </div>
      </div>
    </figure>

    <!-- ── PROFILE ── -->
    <figure class="screen">
      <div class="phone">
        <div class="app-head">
          <div class="head-row">
            <span class="mark"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3h8M2 6h6M2 9h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <span class="wordmark">FairFeed</span>
            <span class="chip-quiet">Uni Konstanz</span>
          </div>
          <div class="segs three"><span class="seg done"></span><span class="seg done"></span><span class="seg"></span></div>
        </div>
        <div class="app-body">
          <h2>Here is what we took from you</h2>
          <div class="profile">
            <span class="profile-label">Your feed is sorted around this</span>
            <q>You want <mark>safer cycling routes</mark> and <mark>more trees and green space</mark> near home, and things for teenagers to do. You are less keen on car parks and festivals.</q>
          </div>
          <div class="tally">
            <div class="t-more"><b>3</b>More like this</div>
            <div class="t-neut"><b>3</b>Neutral</div>
            <div class="t-less"><b>2</b>Less like this</div>
          </div>
          <button class="btn push" type="button">See my feed →</button>
        </div>
      </div>
    </figure>

    <!-- ── FEED (swipe) ── -->
    <figure class="screen">
      <div class="phone">
        <div class="app-head">
          <div class="head-row">
            <span class="mark"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3h8M2 6h6M2 9h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <span class="wordmark">FairFeed</span>
            <span class="reject-pill" id="feed-pill">✕ 0 rejects</span>
          </div>
          <div class="segs three"><span class="seg done"></span><span class="seg done"></span><span class="seg done"></span></div>
          <div class="step-row">
            <button class="finish" type="button">Finish →</button>
          </div>
        </div>
        <div class="deck" id="feed-deck" tabindex="0" aria-label="Your feed. Swipe or use the arrow keys."></div>
        <div class="swipe-bar">
          <div class="swipe-row">
            <button class="swipe-btn less" type="button" data-deck="feed" data-dir="less" aria-label="Reject">✕</button>
            <button class="swipe-btn neutral" type="button" data-deck="feed" data-dir="neutral" aria-label="Neutral">–</button>
            <button class="swipe-btn more" type="button" data-deck="feed" data-dir="more" aria-label="Support">✓</button>
          </div>
          <p class="progress-line" id="feed-progress"><strong>0 rated</strong> · 1 of 124</p>
        </div>
      </div>
    </figure>

  </section>

  <p class="credits"><a href="credits.html" target="_blank" rel="noopener">Photo credits</a></p>


</div>

<script>
/* Fit the row of four screens into the window by scaling it as one piece. */
(function () {
  var stage = document.querySelector(".wrap");
  function fit() {
    stage.style.transform = "";
    if (window.innerWidth < 700) return;
    var w = stage.scrollWidth, h = stage.scrollHeight;
    var s = Math.min(1, window.innerWidth / w, window.innerHeight / h);
    stage.style.transformOrigin = "top left";
    stage.style.transform = "translate(" + Math.max(0, (window.innerWidth - w * s) / 2) + "px, 0) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener("load", fit);
  fit();
})();

(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* calibration: two sets of four real Eastbrook proposals, all with photos */
  var CAL_SETS = [
    [
      { t: "Cycle links to the new city forest", img: "img/cal_18453.jpg" },
      { t: "More benches to sit on across Eastbrook", img: "img/cal_18994.jpg" },
      { t: "Car park at the riverside path entrance", img: "img/cal_17881.jpg" },
      { t: "Basketball courts for the new housing area", img: "img/cal_19289.jpg" }
    ],
    [
      { t: "Cycle lane. Linking the central park with the recreation ground", img: "img/cal_17251.jpg" },
      { t: "Replace felled trees and plant in new streets across the area", img: "img/cal_18813.jpg" },
      { t: "Blues nights in the park", img: "img/cal_17811.jpg" },
      { t: "Installing a recycling point by the retail park", img: "img/cal_19137.jpg" }
    ]
  ];

  var FEED = [
    { cat: "Parks, trees & green space", lifted: true, reason: "Because you mentioned “trees”", title: "Plant trees in one of the few streets without any", img: "img/street_trees.jpg",
      desc: "We are asking for deciduous trees to be planted in one of the few streets in the neighbourhood without any, on the road beside the recreation ground. Trees provide shade and bring down the summer temperatures.",
      meta: ["383 votes", "€50,000", "Funded in 2021"] },
    { cat: "Parks, trees & green space", reason: "Because you mentioned “trees” and “green”", title: "Tree-pit gardens in the streets near the high street", img: "img/treepit.jpg",
      desc: "Eastbrook has many street trees. Each one has a tree pit at its base, the opening it sits in. And every tree pit could hold a small garden, a green space reclaimed from the ground that would make the street more welcoming.",
      meta: ["435 votes", "€12,000", "Funded in 2021"] },
    { cat: "Parks, trees & green space", reason: "Because you mentioned “trees” and “green”", title: "Restoring the park beside the ring road",
      desc: "The park beside the ring road is one that has suffered complete neglect for decades and needs restoring so that all residents can enjoy it. Across 50% of the park the trees and green areas either do not exist or are not looked after.",
      meta: ["478 votes", "€600,000", "Not funded in 2021"] }
  ];

  var EYE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>';

  var LABELS = {
    cal:  { more: "More like this", less: "Less like this", neutral: "Neutral" },
    feed: { more: "Support", less: "Reject", neutral: "Neutral" }
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function cardHtml(p, mode) {
    /* no category and no guess on the card: nothing that primes the answer */
    return (p.lifted ? '<div class="badge-row"><button class="badge badge-lift" type="button" aria-expanded="false">' + EYE + ' Lifted</button></div>' : '') +
      (p.lifted ? '<p class="lift-pop" role="note" hidden>This proposal is lifted because it doesn\'t have many votes yet.</p>' : '') +
      (p.reason ? '<p class="reason">' + esc(p.reason) + '</p>' : '') +
      '<h3 class="card-title">' + esc(p.title) + '</h3>' +
      (p.img ? '<img class="card-img" src="' + p.img + '" alt="" draggable="false">' : '') +
      '<p class="card-desc">' + esc(p.desc) + '</p>' +
      '<button class="readmore" type="button">Read more →</button>' +
      '<span class="stamp more">' + LABELS[mode].more + '</span>' +
      '<span class="stamp less">' + LABELS[mode].less + '</span>' +
      '<span class="stamp neutral">↑ ' + LABELS[mode].neutral + '</span>';
  }

  function makeDeck(mode, items, deckEl, hooks) {
    var state = { i: 0, answers: [], busy: false };

    function render() {
      deckEl.innerHTML = "";
      if (state.i >= items.length) {
        var done = document.createElement("div");
        done.className = "deck-done";
        /* calibration ends without a list: the app goes straight to screen 4 */
        done.innerHTML = '<strong>' + (mode === "cal" ? "All 5 rated" : "End of this sample") + '</strong>' +
          (mode === "cal" ? '<p>Next: screen 4.</p>' : '<div class="log">' + state.answers.map(function (a) {
            return '<span><i class="v-' + a.dir + '">' + LABELS[mode][a.dir] + '</i>' + esc(a.title) + '</span>';
          }).join("") + '</div>') +
          '<button class="btn ghost" type="button">Start over</button>';
        done.querySelector("button").addEventListener("click", function () {
          state.i = 0; state.answers = []; if (hooks.reset) hooks.reset(); update(); render();
        });
        deckEl.appendChild(done);
        return;
      }
      if (items[state.i + 1]) {
        var under = document.createElement("div");
        under.className = "card under" + (items[state.i + 1].img ? "" : " no-img") + (items[state.i + 1].lifted ? " lifted" : "");
        under.innerHTML = cardHtml(items[state.i + 1], mode);
        deckEl.appendChild(under);
      }
      var top = document.createElement("div");
      top.className = "card" + (items[state.i].img ? "" : " no-img") + (items[state.i].lifted ? " lifted" : "");
      top.innerHTML = cardHtml(items[state.i], mode);
      deckEl.appendChild(top);
      bindDrag(top);
      var lift = top.querySelector(".badge-lift");
      if (lift) {
        var pop = top.querySelector(".lift-pop");
        var toggle = function () { pop.hidden = !pop.hidden; lift.setAttribute("aria-expanded", String(!pop.hidden)); };
        lift.addEventListener("click", toggle);
        pop.addEventListener("click", toggle);
      }
    }

    function stamps(card, dx, dy) {
      var s = card.querySelectorAll(".stamp");
      var up = -dy > Math.abs(dx) ? Math.min(1, -dy / 90) : 0;
      s[0].style.opacity = dx > 0 && !up ? Math.min(1, dx / 90) : 0;
      s[1].style.opacity = dx < 0 && !up ? Math.min(1, -dx / 90) : 0;
      s[2].style.opacity = up;
    }

    function commit(dir) {
      var card = deckEl.querySelector(".card:not(.under)");
      if (!card || state.busy) return;
      if (hooks.allow && !hooks.allow(dir)) {
        card.classList.add("snap");
        card.style.transform = "";
        stamps(card, 0, 0);
        return;
      }
      state.busy = true;
      var x = dir === "more" ? 520 : dir === "less" ? -520 : 0;
      var y = dir === "neutral" ? -760 : 40;
      var r = dir === "more" ? 18 : dir === "less" ? -18 : 0;
      stamps(card, x, dir === "neutral" ? y : 0);
      state.answers.push({ dir: dir, title: items[state.i].title });
      if (hooks.commit) hooks.commit(dir);
      var finish = function () { state.i++; state.busy = false; update(); render(); };
      if (reduce) { finish(); return; }
      card.classList.remove("snap");
      card.classList.add("fly");
      card.style.transform = "translate(" + x + "px," + y + "px) rotate(" + r + "deg)";
      card.style.opacity = "0";
      setTimeout(finish, 300);
    }

    function bindDrag(card) {
      var sx = 0, sy = 0, dx = 0, dy = 0, dragging = false;
      card.addEventListener("pointerdown", function (e) {
        if (e.target.closest("button") || state.busy) return;
        dragging = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
        card.classList.remove("snap");
        card.setPointerCapture(e.pointerId);
      });
      card.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        dx = e.clientX - sx; dy = e.clientY - sy;
        card.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + (dx * 0.06) + "deg)";
        stamps(card, dx, dy);
      });
      var end = function () {
        if (!dragging) return;
        dragging = false;
        var dir = null;
        if (-dy > 90 && -dy > Math.abs(dx)) dir = "neutral";
        else if (dx > 90) dir = "more";
        else if (dx < -90) dir = "less";
        if (dir) { commit(dir); return; }
        card.classList.add("snap");
        card.style.transform = "";
        stamps(card, 0, 0);
      };
      card.addEventListener("pointerup", end);
      card.addEventListener("pointercancel", end);
    }

    function update() { if (hooks.update) hooks.update(state); }

    deckEl.addEventListener("keydown", function (e) {
      var dir = { ArrowRight: "more", ArrowLeft: "less", ArrowUp: "neutral" }[e.key];
      if (dir) { e.preventDefault(); commit(dir); }
    });
    document.querySelectorAll('.swipe-btn[data-deck="' + mode + '"]').forEach(function (b) {
      b.addEventListener("click", function () { commit(b.getAttribute("data-dir")); });
    });

    update(); render();
  }

  /* ── calibration info button: tap to show, tap again or anywhere else to hide ── */
  var infoBtn = document.getElementById("cal-info");
  var infoPop = document.getElementById("cal-info-pop");
  function setInfo(open) { infoPop.hidden = !open; infoBtn.setAttribute("aria-expanded", String(open)); }
  infoBtn.addEventListener("click", function (e) { e.stopPropagation(); setInfo(infoPop.hidden); });
  document.addEventListener("click", function (e) { if (!infoPop.hidden && e.target !== infoPop) setInfo(false); });

  /* ── calibration: a set of four, "✕ Less" / "✓ More" per tile, tap again = undo, untouched = neutral ── */
  var calSet = 0;
  var calGrid = document.getElementById("cal-grid");
  var calNext = document.getElementById("cal-next");
  function paintCal() {
    calGrid.innerHTML = CAL_SETS[calSet].map(function (p) {
      return '<div class="cal-tile" data-vote="0"><img class="cal-img" src="' + p.img + '" alt="">' +
        '<span class="cal-title">' + esc(p.t) + '</span>' +
        '<div class="duo"><button type="button" class="less" aria-pressed="false">✕ Less</button>' +
        '<button type="button" class="more" aria-pressed="false">✓ More</button></div></div>';
    }).join("");
    calGrid.querySelectorAll(".cal-tile").forEach(function (tile) {
      tile.querySelectorAll(".duo button").forEach(function (b) {
        b.addEventListener("click", function () {
          var want = b.classList.contains("more") ? "1" : "-1";
          var vote = tile.getAttribute("data-vote") === want ? "0" : want;
          tile.setAttribute("data-vote", vote);
          tile.classList.toggle("more", vote === "1");
          tile.classList.toggle("less", vote === "-1");
          tile.querySelector(".duo .more").setAttribute("aria-pressed", String(vote === "1"));
          tile.querySelector(".duo .less").setAttribute("aria-pressed", String(vote === "-1"));
        });
      });
    });
    document.getElementById("cal-count").textContent = "Set " + (calSet + 1) + " of " + CAL_SETS.length;
    calNext.textContent = calSet === CAL_SETS.length - 1 ? "Done →" : "Next 4 →";
  }
  calNext.addEventListener("click", function () { calSet = (calSet + 1) % CAL_SETS.length; paintCal(); });
  paintCal();

  /* ── feed: reject is earned (2 ratings buy 1), shown only as a count ── */
  var FEED_TOTAL = 124;   // 132 proposals minus the 8 rated in calibration
  var rated = 0, used = 0, at = 0;
  var pill = document.getElementById("feed-pill");
  var progress = document.getElementById("feed-progress");
  var lessBtn = document.querySelector('.swipe-btn[data-deck="feed"][data-dir="less"]');
  function left() { return Math.floor(rated / 2) - used; }
  function paint() {
    var n = left();
    pill.textContent = "✕ " + n + " reject" + (n === 1 ? "" : "s");
    pill.classList.toggle("live", n > 0);
    lessBtn.classList.toggle("locked", n <= 0);
    progress.innerHTML = "<strong>" + (rated + used) + " rated</strong> · " + Math.min(at + 1, FEED_TOTAL) + " of " + FEED_TOTAL;
  }
  makeDeck("feed", FEED, document.getElementById("feed-deck"), {
    allow: function (dir) {
      if (dir !== "less" || left() > 0) return true;
      pill.classList.remove("nudge"); void pill.offsetWidth; pill.classList.add("nudge");
      return false;
    },
    commit: function (dir) { if (dir === "less") used++; else rated++; },
    reset: function () { rated = 0; used = 0; },
    update: function (s) { at = s.i; paint(); }
  });
})();
</script>
</body>
